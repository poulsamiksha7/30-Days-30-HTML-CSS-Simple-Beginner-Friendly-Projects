<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weekly Planner</h1>
    <div class="planner">
        <div class="day-card mon">
            <div class="day-name">Monday</div>
            <div class="tasks">☑️ Plan the week <br> ☑️Morning Walk</div>
        </div><div class="day-card tue">
            <div class="day-name">Tuesday</div>
            <div class="tasks">☑️ Study Session <br> ☑️ Grocery Shopping</div>
        </div>
        <div class="day-card wed">
            <div class="day-name">Wednesday</div>
            <div class="tasks">☑️Mid-week review <br> ☑️Workout</div>
        </div>
        <div class="day-card thu">
            <div class="day-name">Thursday</div>
            <div class="tasks">☑️Work on project <br> ☑️Read a book</div>
        </div>
        <div class="day-card fri">
            <div class="day-name">Friday</div>
            <div class="tasks">☑️Finish tasks <br> ☑️Relax evening</div>
        </div>
        <div class="day-card sat">
            <div class="day-name">Saturday</div>
            <div class="tasks">☑️Clean room <br> ☑️Meet friends</div>
        </div>
        <div class="day-card sun">
            <div class="day-name">Sunday</div>
            <div class="tasks">☑️Self-care day <br> ☑️Weekly reset</div>
        </div>
    </div>
</body>
</html>
