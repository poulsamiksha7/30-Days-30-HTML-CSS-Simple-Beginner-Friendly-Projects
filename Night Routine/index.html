<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before I Sleep Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="checklist">
    <h2>🌙 Before I Sleep ✨</h2>
    <ul>
      <li><input type="checkbox"> <span class="icon">📖</span> Read 10 pages</li>
      <li><input type="checkbox"> <span class="icon">🧘‍♀</span> 5 min Meditation</li>
      <li><input type="checkbox"> <span class="icon">🧴</span> Skincare Routine</li>
      <li><input type="checkbox"> <span class="icon">✍</span> Journal Gratitude</li>
      <li><input type="checkbox"> <span class="icon">🔌</span> Put phone away</li>
      <li><input type="checkbox"> <span class="icon">💤</span> Lights Off</li>
    </ul>
  </div>
</body>
</html>
