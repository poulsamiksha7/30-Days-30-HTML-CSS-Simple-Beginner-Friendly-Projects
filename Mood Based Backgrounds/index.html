<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mood Background</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="radio" name="mood" id="happy">
  <input type="radio" name="mood" id="sad">
  <input type="radio" name="mood" id="angry">
  <input type="radio" name="mood" id="calm">

  <div class="wrapper">
    <h1>Choose Your Mood</h1>
    <label for="happy">😊 Happy</label>
    <label for="sad">😢 Sad</label>
    <label for="angry">😠 Angry</label>
    <label for="calm">😌 Calm</label>
  </div>
</body>
</html>
