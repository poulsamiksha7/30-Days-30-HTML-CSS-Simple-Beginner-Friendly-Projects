<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Themed Timetable</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <table class="timetable">
    <caption>✨ My Daily Routine ✨</caption>
    <thead>
      <tr>
        <th>Time</th>
        <th>Activity</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>6:00 AM</td>
        <td>Wake Up & Freshen Up</td>
      </tr>
      <tr>
        <td>7:00 AM</td>
        <td>Exercise / Yoga</td>
      </tr>
      <tr>
        <td>8:00 AM</td>
        <td>Breakfast</td>
      </tr>
      <tr>
        <td>9:00 AM - 1:00 PM</td>
        <td>Study / Coding Practice</td>
      </tr>
      <tr>
        <td>1:00 PM</td>
        <td>Lunch & Relax</td>
      </tr>
      <tr>
        <td>2:00 PM - 6:00 PM</td>
        <td>Projects / Web Dev</td>
      </tr>
      <tr>
        <td>7:00 PM</td>
        <td>Dinner</td>
      </tr>
      <tr>
        <td>8:00 PM - 10:00 PM</td>
        <td>Revision / Reading</td>
      </tr>
      <tr>
        <td>10:30 PM</td>
        <td>Sleep 😴</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
