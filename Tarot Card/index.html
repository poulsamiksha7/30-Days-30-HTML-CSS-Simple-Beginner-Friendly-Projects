<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Spread — Past • Present • Future</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>✨ Your Tarot Spread ✨</h1>

  <div class="tarot">
    <div class="card">
      <h2>Past</h2>
      <div class="symbol">🌙</div>
      <p>Lessons from the past guide your present path.</p>
    </div>

    <div class="card">
      <h2>Present</h2>
      <div class="symbol">☀️</div>
      <p>Clarity and awareness shine in the moment.</p>
    </div>

    <div class="card">
      <h2>Future</h2>
      <div class="symbol">⭐</div>
      <p>Hope, growth, and opportunities lie ahead.</p>
    </div>
  </div>
</body>
</html>
